app:
  admin:
    initial-password: ${INITIAL_ADMIN_PASSWORD}

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_DBNAME:XE}
    username: ${ORACLE_USER:system}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-init-sql: "BEGIN EXECUTE IMMEDIATE 'ALTER SESSION SET NLS_DATE_FORMAT = ''YYYY-MM-DD HH24:MI:SS'''; EXECUTE IMMEDIATE 'ALTER SESSION SET TIME_ZONE = ''Africa/Tunis'''; END;"
      data-source-properties:
        oracle.jdbc.defaultNChar: "true"
        oracle.jdbc.charSetId: "AL32UTF8"
    sqlserver:
      url: ${SQLSERVER_URL}
      username: ${SQLSERVER_USER}
      password: ${SQLSERVER_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

logging:
  level:
    com.adient.firewall: DEBUG
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN